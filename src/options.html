<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>TektikUYAP Ayarları</title><style>
body{font:14px system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#1d2433}label{display:block;margin:14px 0 4px;font-weight:600}input{width:100%;padding:6px;box-sizing:border-box;font-family:monospace}button{margin-top:16px;padding:8px 14px;background:#8b1e2d;color:#fff;border:0;border-radius:6px;cursor:pointer}small{color:#5b6475}
</style></head><body>
<h1>TektikUYAP Ayarları</h1>
<p><small>Evrak indirme adresi şablonları. <code>{evrakId}</code>, <code>{dosyaId}</code> ve <code>{yargiTuru}</code> yer tutucuları otomatik doldurulur. UYAP adresi değişirse, portalda bir evrakı tek başına indirirken tarayıcının Geliştirici Araçları → Ağ sekmesinde görünen adresi buraya yazın.</small></p>
<label>Avukat UYAP</label><input id="avukat">
<label>Bilirkişi UYAP</label><input id="bilirkisi">
<label>Vatandaş UYAP</label><input id="vatandas">
<label>İstekler arası bekleme (ms)</label><input id="delayMs" type="number" min="0">
<button id="kaydet">Kaydet</button> <button id="sifirla">Varsayılana dön</button> <span id="durum"></span>
<script src="defaults.js"></script><script src="options.js"></script>
</body></html>
